tasks:
  apiBuild:
    action: !io.heapy.ktc.plugins.bcv.buildApi
      settings: ${pluginSettings}
      inputJar: ${module.jar}
      outputFile: ${taskOutputDir}/current.api
  apiCheck:
    action: !io.heapy.ktc.plugins.bcv.checkApi
      moduleName: ${module.name}
      actualFile: ${tasks.apiBuild.action.outputFile}
      baselineFile: ${module.rootDir}/${pluginSettings.apiDirectory}/${module.name}.api
  apiDump:
    action: !io.heapy.ktc.plugins.bcv.dumpApi
      actualFile: ${tasks.apiBuild.action.outputFile}
      baselineFile: ${tasks.apiCheck.action.baselineFile}

  klibApiBuild:
    action: !io.heapy.ktc.plugins.bcv.buildKlibApi
      projectDir: ${project.rootDir}
      moduleName: ${module.name}
      settings: ${pluginSettings}
      outputDir: ${taskOutputDir}
  klibApiCheck:
    action: !io.heapy.ktc.plugins.bcv.checkKlibApi
      settings: ${pluginSettings}
      actualFile: ${tasks.klibApiBuild.action.outputDir}/current.klib.api
      baselineFile: ${module.rootDir}/${pluginSettings.apiDirectory}/${module.name}.klib.api
  klibApiDump:
    action: !io.heapy.ktc.plugins.bcv.updateKlibApi
      settings: ${pluginSettings}
      actualFile: ${tasks.klibApiBuild.action.outputDir}/current.klib.api
      baselineFile: ${module.rootDir}/${pluginSettings.apiDirectory}/${module.name}.klib.api

checks:
  - apiCheck
  - klibApiCheck

commands:
  - apiDump
  - klibApiDump
